<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1D5DB"/>
      <stop offset="30%" stop-color="#9CA3AF"/>
      <stop offset="60%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Puller body -->
  <rect x="175" y="80" width="50" height="240" rx="10" fill="url(#metal)" filter="url(#glow)"/>
  <!-- Grip texture lines -->
  <line x1="185" y1="160" x2="215" y2="160" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <line x1="185" y1="168" x2="215" y2="168" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <line x1="185" y1="176" x2="215" y2="176" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <line x1="185" y1="184" x2="215" y2="184" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <line x1="185" y1="192" x2="215" y2="192" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <line x1="185" y1="200" x2="215" y2="200" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <line x1="185" y1="208" x2="215" y2="208" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <line x1="185" y1="216" x2="215" y2="216" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <!-- Switch puller fork (top) -->
  <path d="M185,80 L185,50 L170,35 M215,80 L215,50 L230,35" fill="none" stroke="url(#metal)" stroke-width="6" stroke-linecap="round"/>
  <!-- Keycap puller wire (bottom) -->
  <path d="M185,320 L185,340 L165,360 L165,370 M215,320 L215,340 L235,360 L235,370" fill="none" stroke="url(#metal)" stroke-width="4" stroke-linecap="round"/>
  <!-- Reflection -->
  <ellipse cx="200" cy="330" rx="50" ry="8" fill="rgba(6,182,212,0.05)"/>
  <text x="200" y="390" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="sans-serif" opacity="0.6">ALUMINUM SWITCH PULLER</text>
</svg>

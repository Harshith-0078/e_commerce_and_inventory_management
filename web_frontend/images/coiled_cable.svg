<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="cable1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="connector" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Coiled cable section -->
  <g filter="url(#glow)">
    <ellipse cx="200" cy="140" rx="60" ry="18" fill="none" stroke="url(#cable1)" stroke-width="7" opacity="0.9"/>
    <ellipse cx="200" cy="160" rx="60" ry="18" fill="none" stroke="url(#cable1)" stroke-width="7" opacity="0.85"/>
    <ellipse cx="200" cy="180" rx="60" ry="18" fill="none" stroke="url(#cable1)" stroke-width="7" opacity="0.8"/>
    <ellipse cx="200" cy="200" rx="60" ry="18" fill="none" stroke="url(#cable1)" stroke-width="7" opacity="0.75"/>
    <ellipse cx="200" cy="220" rx="60" ry="18" fill="none" stroke="url(#cable1)" stroke-width="7" opacity="0.7"/>
    <ellipse cx="200" cy="240" rx="60" ry="18" fill="none" stroke="url(#cable1)" stroke-width="7" opacity="0.65"/>
  </g>
  <!-- Aviator connector -->
  <circle cx="200" cy="100" r="22" fill="url(#connector)" stroke="#6B7280" stroke-width="2"/>
  <circle cx="200" cy="100" r="14" fill="none" stroke="#4B5563" stroke-width="1.5"/>
  <!-- 5 pins -->
  <circle cx="193" cy="95" r="2.5" fill="#D4A84B"/>
  <circle cx="207" cy="95" r="2.5" fill="#D4A84B"/>
  <circle cx="193" cy="107" r="2.5" fill="#D4A84B"/>
  <circle cx="207" cy="107" r="2.5" fill="#D4A84B"/>
  <circle cx="200" cy="101" r="2.5" fill="#D4A84B"/>
  <!-- USB-C end -->
  <rect x="190" y="270" width="20" height="36" rx="6" fill="url(#connector)" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="194" y="278" width="12" height="6" rx="3" fill="#9CA3AF"/>
  <!-- Straight cable sections -->
  <line x1="200" y1="122" x2="200" y2="140" stroke="url(#cable1)" stroke-width="7"/>
  <line x1="200" y1="258" x2="200" y2="270" stroke="url(#cable1)" stroke-width="7"/>
  <!-- Label -->
  <text x="200" y="340" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="sans-serif" opacity="0.6">GX16 AVIATOR USB-C CABLE</text>
  <!-- Reflection -->
  <ellipse cx="200" cy="320" rx="80" ry="6" fill="rgba(6,182,212,0.04)"/>
</svg>

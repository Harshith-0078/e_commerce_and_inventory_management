<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="mouseBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D1A" />
    </linearGradient>
    <linearGradient id="mouseRgbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="mouseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="80" height="80" rx="8" fill="#0A0F1D" />
  <!-- Ergonomic Gaming Mouse Silhouette -->
  <g transform="translate(18, 10)">
    <!-- Main Chassis -->
    <path d="M 22 2 C 32 2 39 12 39 28 C 39 46 34 58 22 58 C 10 58 5 46 5 28 C 5 12 12 2 22 2 Z" fill="url(#mouseBodyGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Split Buttons -->
    <line x1="22" y1="2" x2="22" y2="24" stroke="#0F172A" stroke-width="1.5" />
    <!-- Scroll Wheel with RGB Glow -->
    <rect x="20" y="8" width="4" height="11" rx="2" fill="#0284C7" stroke="#38BDF8" stroke-width="0.8" filter="url(#mouseGlow)" />
    <!-- DPI Switch Button -->
    <rect x="20.5" y="22" width="3" height="4" rx="1" fill="#475569" />
    <!-- RGB Edge Contour Light Strip -->
    <path d="M 9 32 C 9 46 14 54 22 54 C 30 54 35 46 35 32" fill="none" stroke="url(#mouseRgbGrad)" stroke-width="1.8" filter="url(#mouseGlow)" />
    <!-- Nexus Hex Pulse Logo -->
    <polygon points="22,38 25,43 25,48 22,50 19,48 19,43" fill="none" stroke="#38BDF8" stroke-width="1" filter="url(#mouseGlow)" />
  </g>
</svg>

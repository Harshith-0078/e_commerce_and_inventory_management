<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="rgbRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="25%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#0070F3" />
      <stop offset="75%" stop-color="#00DFD8" />
      <stop offset="100%" stop-color="#79F700" />
    </linearGradient>
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="80" height="80" rx="8" fill="#0A0F1D" />
  <!-- Keycap Rows Grid -->
  <g transform="translate(10, 12)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="12" height="12" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="0.9" />
    <rect x="15" y="0" width="12" height="12" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="0.95" />
    <rect x="30" y="0" width="12" height="12" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="0.9" />
    <rect x="45" y="0" width="15" height="12" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="0.85" />
    <!-- Row 2 -->
    <rect x="0" y="15" width="14" height="12" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="0.95" />
    <rect x="17" y="15" width="12" height="12" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="1" />
    <rect x="32" y="15" width="12" height="12" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="0.95" />
    <rect x="47" y="15" width="13" height="12" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="0.9" />
    <!-- Row 3 -->
    <rect x="0" y="30" width="16" height="12" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="0.9" />
    <rect x="19" y="30" width="12" height="12" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="1" />
    <rect x="34" y="30" width="12" height="12" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="0.95" />
    <rect x="49" y="30" width="11" height="12" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="0.85" />
    <!-- Spacebar Row 4 -->
    <rect x="0" y="45" width="16" height="11" rx="2.5" fill="url(#rgbRainbow)" opacity="0.85" />
    <rect x="19" y="45" width="28" height="11" rx="2.5" fill="url(#rgbRainbow)" filter="url(#auraGlow)" opacity="1" />
    <rect x="50" y="45" width="10" height="11" rx="2.5" fill="url(#rgbRainbow)" opacity="0.85" />
  </g>
</svg>

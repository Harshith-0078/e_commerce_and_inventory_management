<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
    </linearGradient>
    <linearGradient id="grease" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F8F0"/>
      <stop offset="100%" stop-color="#E8E0D0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Jar body -->
  <rect x="130" y="120" width="140" height="160" rx="16" fill="url(#jar)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Jar lid -->
  <rect x="120" y="100" width="160" height="30" rx="8" fill="rgba(60,60,80,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Grease fill -->
  <rect x="140" y="150" width="120" height="110" rx="8" fill="url(#grease)" opacity="0.85"/>
  <!-- Label -->
  <rect x="145" y="200" width="110" height="40" rx="4" fill="rgba(10,10,20,0.7)"/>
  <text x="200" y="218" text-anchor="middle" fill="#06B6D4" font-size="10" font-weight="700" font-family="monospace">KRYTOX</text>
  <text x="200" y="232" text-anchor="middle" fill="#94A3B8" font-size="9" font-family="monospace">205g0 | 5g</text>
  <!-- Brush tool -->
  <line x1="290" y1="140" x2="310" y2="300" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <rect x="304" y="280" width="14" height="30" rx="2" fill="#C0A070" opacity="0.8"/>
  <!-- Reflection -->
  <ellipse cx="200" cy="310" rx="90" ry="10" fill="rgba(6,182,212,0.05)"/>
  <text x="200" y="360" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="sans-serif" opacity="0.6">KRYTOX 205g0 LUBRICANT</text>
</svg>
